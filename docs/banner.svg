<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="企业级宝塔邮箱系统（bt-mailbox）">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/><stop offset="60%" stop-color="#111d33"/><stop offset="100%" stop-color="#0a1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.75">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55"/><stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 34 L34 34 L34 0" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#ef4444" stroke-opacity="0.45" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
    <text x="60" y="118" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="0.5">企业级宝塔邮箱系统（bt-mailbox）</text>
    <text x="60" y="186" font-size="23" fill="#9fb3c8">Ubuntu + 宝塔面板一键部署，Postfix 发信 + Dovecot 收信，带网页后台和 AI 垃圾邮件过滤，</text><text x="60" y="222" font-size="23" fill="#9fb3c8">支持无限注册邮箱账号</text>
    <g><rect x="60" y="258" width="120" height="38" rx="19.0" fill="#ffffff" fill-opacity="0.10" stroke="#ef4444" stroke-opacity="0.55"/><text x="82" y="283" font-size="19" fill="#e2e8f0">Postfix</text></g><g><rect x="193.62" y="258" width="120" height="38" rx="19.0" fill="#ffffff" fill-opacity="0.10" stroke="#ef4444" stroke-opacity="0.55"/><text x="215.62" y="283" font-size="19" fill="#e2e8f0">Dovecot</text></g><g><rect x="327.24" y="258" width="133" height="38" rx="19.0" fill="#ffffff" fill-opacity="0.10" stroke="#ef4444" stroke-opacity="0.55"/><text x="349.24" y="283" font-size="19" fill="#e2e8f0">AI 反垃圾</text></g>
  </g>
  <text x="1160" y="286" font-size="16" fill="#64748b" text-anchor="end" font-family="system-ui, sans-serif">aiwozhonghua81 / bt-mailbox</text>
</svg>
