# Dovecot配置文件 - 企业级邮箱系统
# 支持IMAP/POP3/LMTP服务，集成MySQL虚拟用户

# 基础配置
protocols = imap pop3 lmtp
listen = *, ::
base_dir = /var/run/dovecot/
instance_name = dovecot

# 日志配置
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
debug_log_path = /var/log/dovecot-debug.log
log_timestamp = "%Y-%m-%d %H:%M:%S "

# SSL/TLS配置
ssl = required
ssl_cert = </etc/ssl/certs/mailserver.crt
ssl_key = </etc/ssl/private/mailserver.key
ssl_protocols = !SSLv3 !TLSv1 !TLSv1.1
ssl_cipher_list = ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK
ssl_prefer_server_ciphers = yes
ssl_dh = </etc/dovecot/dh.pem

# 邮件存储配置
mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

# 虚拟用户配置
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# 认证配置
auth_mechanisms = plain login
auth_username_format = %Lu
auth_verbose = yes
auth_verbose_passwords = no
auth_debug = no
auth_debug_passwords = no

# 服务配置
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 0
  process_limit = 1000
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
  inet_listener lmtp {
    address = 127.0.0.1
    port = 24
  }
}

service imap {
  vsz_limit = 256M
  process_limit = 1024
}

service pop3 {
  process_limit = 1024
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
    group = vmail
  }
  user = dovecot
}

service auth-worker {
  user = vmail
}

service dict {
  unix_listener dict {
    mode = 0600
    user = vmail
    group = vmail
  }
}

# 协议配置
protocol lmtp {
  postmaster_address = postmaster@example.com
}

protocol imap {
  mail_max_userip_connections = 20
  imap_idle_notify_interval = 2 mins
  imap_client_workarounds = delay-newmail tb-extra-mailbox-sep
}

protocol pop3 {
  mail_max_userip_connections = 10
  pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
}

# 插件配置
mail_plugins = $mail_plugins quota

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}

protocol pop3 {
  mail_plugins = $mail_plugins
}

protocol lmtp {
  mail_plugins = $mail_plugins
}

# 配额配置
plugin {
  quota = maildir:User quota
  quota_rule = *:storage=1G
  quota_rule2 = Trash:storage=+100M
  quota_warning = storage=95%% quota-warning 95 %u
  quota_warning2 = storage=80%% quota-warning 80 %u
}

service quota-warning {
  executable = script /usr/local/bin/quota-warning.sh
  user = dovecot
  unix_listener quota-warning {
    user = vmail
  }
}

# Sieve配置
plugin {
  sieve = ~/.dovecot.sieve
  sieve_dir = ~/sieve
  sieve_global_dir = /var/lib/dovecot/sieve/global/
  sieve_global_path = /var/lib/dovecot/sieve/default.sieve
  sieve_before = /var/lib/dovecot/sieve/before.d/
  sieve_after = /var/lib/dovecot/sieve/after.d/
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

# 统计配置
plugin {
  stats_refresh = 30 secs
  stats_track_cmds = yes
}

service stats {
  fifo_listener stats-mail {
    mode = 0600
    user = vmail
  }
}

# 复制配置（用于备份）
plugin {
  mail_replica = tcp:backup.example.com:12345
}

# 全文搜索配置
plugin {
  fts = lucene
  fts_lucene = whitespace_chars=@.
  fts_autoindex = yes
}

# 邮件过期配置
plugin {
  expire = Trash
  expire2 = Spam
  expire_dict = redis:host=127.0.0.1:port=6379:db=1
}

service expire-tool {
  executable = expire-tool --test
}

# 性能优化
default_process_limit = 1000
default_client_limit = 1000
default_vsz_limit = 256M

# 调试配置
mail_debug = no
verbose_proctitle = yes

# 命名空间配置
namespace inbox {
  type = private
  separator = /
  prefix = 
  location = 
  inbox = yes
  hidden = no
  list = yes
  subscriptions = yes
  
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Sent {
    special_use = \Sent
  }
}

# 共享邮箱配置
namespace shared {
  type = shared
  separator = /
  prefix = shared/%%u/
  location = maildir:%%h/Maildir:INDEX=~/Maildir/shared/%%u
  subscriptions = no
  list = children
}

# 公共邮箱配置
namespace public {
  type = public
  separator = /
  prefix = public/
  location = maildir:/var/mail/public
  subscriptions = no
  list = children
}

# 管理配置
doveadm_password = {PLAIN}admin_password_here
doveadm_port = 12345

service doveadm {
  inet_listener {
    port = 12345
  }
}

# 导入配置
import_environment = TZ
